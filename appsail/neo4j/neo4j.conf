# KSP InvestigateAI Neo4j 5 Community AppSail configuration.
# Catalyst Data Store is authoritative; this instance is a graph projection/query store.
server.default_listen_address=0.0.0.0
server.bolt.listen_address=0.0.0.0:7687
server.http.listen_address=127.0.0.1:7474
server.https.enabled=false
server.directories.import=/var/lib/neo4j/import
server.memory.heap.initial_size=256m
server.memory.heap.max_size=512m
server.memory.pagecache.size=256m
server.security.auth_enabled=true
server.logs.query.enabled=OFF
server.db.query_cache_size=1000
server.jvm.additional=-Ddbms.security.procedures.unrestricted=apoc.*
server.jvm.additional=-Ddbms.security.procedures.allowlist=apoc.*
